# be quiet! Light Mount TKL. Every binding is limited to this keyboard, so nothing here
# does anything when it isn't plugged in. Lighting runs as kbd-rainbow.service.
set $bq_kbd 14143:24:be_quiet_be_quiet!_Light_Mount_TKL_Keyboard
set $bq_kbd2 14143:24:be_quiet_be_quiet!_Light_Mount_TKL

# Lighting: Ctrl + wheel changes effect (press toggles built-in lighting), Alt + wheel brightness
bindsym --input-device=$bq_kbd Ctrl+XF86AudioRaiseVolume exec /usr/local/bin/kbd-rainbow next
bindsym --input-device=$bq_kbd Ctrl+XF86AudioLowerVolume exec /usr/local/bin/kbd-rainbow prev
bindsym --input-device=$bq_kbd Ctrl+XF86AudioMute exec /usr/local/bin/kbd-rainbow toggle
bindsym --input-device=$bq_kbd $mod+XF86AudioRaiseVolume exec /usr/local/bin/kbd-rainbow brighter
bindsym --input-device=$bq_kbd $mod+XF86AudioLowerVolume exec /usr/local/bin/kbd-rainbow dimmer
bindsym --input-device=$bq_kbd2 Ctrl+XF86AudioRaiseVolume exec /usr/local/bin/kbd-rainbow next
bindsym --input-device=$bq_kbd2 Ctrl+XF86AudioLowerVolume exec /usr/local/bin/kbd-rainbow prev
bindsym --input-device=$bq_kbd2 Ctrl+XF86AudioMute exec /usr/local/bin/kbd-rainbow toggle
bindsym --input-device=$bq_kbd2 $mod+XF86AudioRaiseVolume exec /usr/local/bin/kbd-rainbow brighter
bindsym --input-device=$bq_kbd2 $mod+XF86AudioLowerVolume exec /usr/local/bin/kbd-rainbow dimmer

# No Print key: M1 (sends Play/Pause) screenshots, M2 (Next) screen-records, M3 (Prev) does a barrel roll
bindsym --input-device=$bq_kbd XF86AudioPlay exec ~/.local/bin/screenshot.sh
bindsym --input-device=$bq_kbd Shift+XF86AudioPlay exec ~/.local/bin/screenshot_select.sh
bindsym --input-device=$bq_kbd XF86AudioNext exec ~/.local/bin/screenrecord.sh
bindsym --input-device=$bq_kbd Shift+XF86AudioNext exec ~/.local/bin/screenrecord.sh select
bindsym --input-device=$bq_kbd XF86AudioPrev exec ~/.local/bin/barrel-roll.sh
bindsym --input-device=$bq_kbd2 XF86AudioPlay exec ~/.local/bin/screenshot.sh
bindsym --input-device=$bq_kbd2 Shift+XF86AudioPlay exec ~/.local/bin/screenshot_select.sh
bindsym --input-device=$bq_kbd2 XF86AudioNext exec ~/.local/bin/screenrecord.sh
bindsym --input-device=$bq_kbd2 Shift+XF86AudioNext exec ~/.local/bin/screenrecord.sh select
bindsym --input-device=$bq_kbd2 XF86AudioPrev exec ~/.local/bin/barrel-roll.sh

for_window [app_id="barrel-roll"] floating enable, border none, resize set 75 ppt 35 ppt, move position center
for_window [title="^barrel-spin"] floating enable, border none, fullscreen enable
