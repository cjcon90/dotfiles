# ── Prefix ────────────────────────────────────────────────────────────────────
set -g prefix C-b
bind C-b send-prefix

# ── General ───────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g set-clipboard on
set -g base-index 0            # windows start at 0 (first-class)
set -g pane-base-index 1       # panes start at 1
set -gw renumber-windows off   # keep index gaps; killing win 0 leaves slot 0 free so `c` reclaims it
set -g history-limit 50000
set -sg escape-time 0         # no delay for ESC in vim
set -g focus-events on
set -g status-interval 5
set -g display-time 2000
set -g allow-passthrough on
set -g detach-on-destroy off
set -g status-position bottom

# ── Vim navigation ────────────────────────────────────────────────────────────
set -gw mode-keys vi

# Copy mode vim bindings
bind Enter copy-mode
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi y   send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle

# Pane navigation (prefix + hjkl). C-l is intentionally NOT bound so it
# passes through to the shell as a normal clear-screen.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Splits ────────────────────────────────────────────────────────────────────
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind -   split-window -v -c "#{pane_current_path}"
bind |   split-window -h -c "#{pane_current_path}"
bind c   new-window   -c "#{pane_current_path}"

# ── Quick switch ──────────────────────────────────────────────────────────────
bind Space last-window

# ── Quick config reload ───────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# ── Dracula theme (matches lualine; mode colour turns pink on prefix, yellow in copy mode) ──
set -g status-style "bg=#44475a,fg=#f8f8f2"
set -g status-left-length 30
set -g status-right-length 40
set -g status-left "#[fg=#282a36,bg=#{?client_prefix,#ff79c6,#{?pane_in_mode,#f1fa8c,#bd93f9}},bold]  #S#[fg=#{?client_prefix,#ff79c6,#{?pane_in_mode,#f1fa8c,#bd93f9}},bg=#44475a,nobold] "
set -g status-right "#[fg=#5f6a8e]#[fg=#f8f8f2,bg=#5f6a8e]%d/%m #[fg=#{?client_prefix,#ff79c6,#{?pane_in_mode,#f1fa8c,#bd93f9}}]#[fg=#282a36,bg=#{?client_prefix,#ff79c6,#{?pane_in_mode,#f1fa8c,#bd93f9}},bold]%H:%M "
set -g window-status-separator ""
set -g window-status-current-style default
set -g window-status-format " #I #W "
set -g window-status-current-format "#[fg=#5f6a8e]#[fg=#f8f8f2,bg=#5f6a8e,bold]#I #W#{?window_zoomed_flag, 󰊓,}#[fg=#5f6a8e,bg=#44475a,nobold]"
set -g pane-border-lines heavy
set -g pane-border-style "fg=#44475a"
set -g pane-active-border-style "fg=#bd93f9"
set -g message-style "bg=#44475a,fg=#f8f8f2"
set -g mode-style "bg=#44475a,fg=#bd93f9"
set -g popup-border-lines rounded
set -g popup-style "bg=#282a36"
set -g popup-border-style "fg=#bd93f9"
set -g menu-border-lines rounded
set -g menu-border-style "fg=#bd93f9"
set -g menu-selected-style "bg=#44475a,fg=#bd93f9"
set -g clock-mode-colour "#bd93f9"

# Shell windows are named after their folder, everything else after the program
set -g automatic-rename-format "#{?#{==:#{pane_current_command},bash},#{b:pane_current_path},#{pane_current_command}}"

# ── Popups ────────────────────────────────────────────────────────────────────
# Fuzzy-find any window in any session
bind s display-popup -E -w 60% -h 50% -T " Switch " "tmux list-windows -a -F '#{session_name}:#{window_index}  #{window_name}' | fzf --no-border --height=100% | cut -d' ' -f1 | xargs -r tmux switch-client -t"
# Scratch shell floating over the panes
bind t display-popup -E -w 80% -h 75% -T " Scratch " -d "#{pane_current_path}"

# Per-machine extras (untracked)
source-file -q ~/.tmux.local.conf
